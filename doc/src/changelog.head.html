<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NuMonitor — Changelog</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #0d1117;
            --bg-tertiary: #161b22;
            --bg-elevated: #1c2128;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-green: #39d353;
            --accent-blue: #58a6ff;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --nu-color: #81D8D0;
            --chart-yellow: #ffcc00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .logo:hover { opacity: 0.8; }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-family: 'Rubik', sans-serif;
            font-weight: 500;
            font-size: 20px;
            letter-spacing: -0.3px;
            color: white;
        }

        .nu-color { color: var(--nu-color); }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .version-entry {
            margin-bottom: 40px;
            padding: 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .version-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .version-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--nu-color);
        }

        .version-date {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .version-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-latest {
            background: rgba(57, 211, 83, 0.15);
            color: var(--accent-green);
        }

        .tag-major {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
        }

        .change-category { margin-bottom: 20px; }
        .change-category:last-child { margin-bottom: 0; }

        .category-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .category-icon { font-size: 16px; }
        .icon-new { color: var(--accent-green); }
        .icon-improve { color: var(--accent-blue); }
        .icon-fix { color: var(--accent-orange); }

        .change-list {
            list-style: none;
            padding-left: 24px;
        }

        .change-list li {
            position: relative;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .change-list li::before {
            content: '•';
            position: absolute;
            left: -16px;
            color: var(--text-muted);
        }

        .change-list ul {
            list-style: none;
            padding-left: 20px;
            margin-top: 8px;
        }

        .change-list ul li {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .change-list ul li::before {
            content: '○';
            font-size: 10px;
        }

        .change-list code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 2px 6px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            color: var(--accent-orange);
        }

        .change-list strong { color: var(--text-primary); }

        .feature-highlight {
            margin: 16px 0;
            padding: 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            border-left: 3px solid var(--nu-color);
        }

        .feature-highlight h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--nu-color);
            margin-bottom: 8px;
        }

        .feature-highlight p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .feature-highlight code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 2px 6px;
            background: var(--bg-primary);
            border-radius: 4px;
            color: var(--chart-yellow);
        }

        .chart-table {
            width: 100%;
            margin: 12px 0;
            border-collapse: collapse;
            font-size: 13px;
        }

        .chart-table th,
        .chart-table td {
            padding: 8px 12px;
            text-align: left;
            border: 1px solid var(--border-color);
        }

        .chart-table th {
            background: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .chart-table td { background: var(--bg-primary); }
        .chart-table .icon { font-size: 16px; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .back-link:hover { text-decoration: underline; }
        .back-link svg { width: 16px; height: 16px; }

        .footer {
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .footer a:hover { text-decoration: underline; }
    </style>
</head>
